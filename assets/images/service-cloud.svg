<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowCloud" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="210" fill="url(#bgGradCloud)"/>
  <rect width="400" height="210" fill="url(#glowCloud)"/>

  <!-- Technical Architectural Grid Overlay -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 35 H 400 M 0 70 H 400 M 0 105 H 400 M 0 140 H 400 M 0 175 H 400"/>
    <path d="M 50 0 V 210 M 100 0 V 210 M 150 0 V 210 M 200 0 V 210 M 250 0 V 210 M 300 0 V 210 M 350 0 V 210"/>
  </g>

  <!-- Sync Orbit Ellipse Arc -->
  <ellipse cx="200" cy="105" rx="120" ry="48" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5,6" opacity="0.35"/>

  <!-- Central Cloud Infrastructure Icon Badge -->
  <g transform="translate(155, 68)" filter="url(#shadowCloud)">
    <!-- Cloud Contour Silhouette -->
    <path d="M 18 42 A 25 25 0 0 1 60 22 A 32 32 0 0 1 108 42 A 22 22 0 0 1 108 72 L 15 72 A 20 20 0 0 1 18 42 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Bi-Directional Synchronize Arrows -->
    <path d="M 50 44 L 60 34 L 70 44 M 60 34 V 62" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 72 54 L 62 64 L 52 54 M 62 64 V 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Local Database Server Stack (Left Side) -->
  <g transform="translate(48, 65)" filter="url(#shadowCloud)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="12" cy="11" r="3" fill="#10b981"/>
    <line x1="22" y1="11" x2="50" y2="11" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <rect x="0" y="28" width="60" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="12" cy="39" r="3" fill="#10b981"/>
    <line x1="22" y1="39" x2="50" y2="39" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <rect x="0" y="56" width="60" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="12" cy="67" r="3" fill="#34d399"/>
    <line x1="22" y1="67" x2="50" y2="67" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Remote Cloud Database Storage (Right Side) -->
  <g transform="translate(290, 68)" filter="url(#shadowCloud)">
    <!-- Top Cylinder Cap -->
    <ellipse cx="30" cy="12" rx="30" ry="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Cylinder Body Layer 1 -->
    <path d="M 0 12 V 32 A 30 10 0 0 0 60 32 V 12" fill="#0369a1" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Cylinder Body Layer 2 -->
    <path d="M 0 32 V 52 A 30 10 0 0 0 60 52 V 32" fill="#0284c7" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Cylinder Body Layer 3 -->
    <path d="M 0 52 V 72 A 30 10 0 0 0 60 72 V 52" fill="#0369a1" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="15" cy="32" r="3" fill="#10b981"/>
    <circle cx="15" cy="52" r="3" fill="#34d399"/>
    <circle cx="15" cy="72" r="3" fill="#2dd4bf"/>
  </g>

  <!-- Dynamic Curved Connection Sync Lines -->
  <path d="M 108 105 Q 135 115 155 105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 290 105 Q 265 115 245 105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
