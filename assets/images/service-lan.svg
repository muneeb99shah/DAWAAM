<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowLan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowLan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="210" fill="url(#bgGradLan)"/>
  <rect width="400" height="210" fill="url(#glowLan)"/>

  <!-- Architectural Technical Grid Overlay -->
  <g opacity="0.06" stroke="#2dd4bf" stroke-width="1">
    <path d="M 0 35 H 400 M 0 70 H 400 M 0 105 H 400 M 0 140 H 400 M 0 175 H 400"/>
    <path d="M 50 0 V 210 M 100 0 V 210 M 150 0 V 210 M 200 0 V 210 M 250 0 V 210 M 300 0 V 210 M 350 0 V 210"/>
  </g>

  <!-- Concentric LAN Radar Waves -->
  <circle cx="200" cy="105" r="72" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.3"/>
  <circle cx="200" cy="105" r="48" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>

  <!-- Connecting Data Conduit Paths -->
  <path d="M 90 60 Q 140 70 170 95" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 310 60 Q 260 70 230 95" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 90 150 Q 140 140 170 115" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 310 150 Q 260 140 230 115" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Central High-Performance LAN Gateway Unit -->
  <g transform="translate(162, 83)" filter="url(#shadowLan)">
    <rect x="0" y="0" width="76" height="44" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <!-- Status Bezel & LED Indicators -->
    <rect x="6" y="6" width="64" height="32" rx="5" fill="#0f172a"/>
    <circle cx="18" cy="22" r="4" fill="#10b981"/>
    <circle cx="32" cy="22" r="4" fill="#2dd4bf"/>
    <circle cx="46" cy="22" r="4" fill="#38bdf8"/>
    <circle cx="60" cy="22" r="4" fill="#f59e0b"/>
    <!-- Dual High-Gain Antennas -->
    <line x1="20" y1="0" x2="14" y2="-16" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="56" y1="0" x2="62" y2="-16" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="14" cy="-16" r="2.5" fill="#34d399"/>
    <circle cx="62" cy="-16" r="2.5" fill="#34d399"/>
  </g>

  <!-- Node 1: POS Billing Terminal (Top Left) -->
  <g transform="translate(45, 40)" filter="url(#shadowLan)">
    <rect x="0" y="0" width="48" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="5" y="5" width="38" height="22" rx="3" fill="#0f766e" opacity="0.85"/>
    <rect x="18" y="36" width="12" height="6" fill="#475569"/>
    <rect x="10" y="42" width="28" height="3" rx="1.5" fill="#334155"/>
  </g>

  <!-- Node 2: Mobile Inventory Tablet (Top Right) -->
  <g transform="translate(305, 42)" filter="url(#shadowLan)">
    <rect x="0" y="0" width="48" height="34" rx="5" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.8"/>
    <rect x="5" y="5" width="38" height="24" rx="3" fill="#0f172a"/>
    <line x1="10" y1="12" x2="32" y2="12" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="24" y2="18" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Node 3: Handheld Barcode Terminal (Bottom Left) -->
  <g transform="translate(52, 132)" filter="url(#shadowLan)">
    <rect x="0" y="0" width="36" height="46" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <rect x="5" y="6" width="26" height="24" rx="3" fill="#0f766e" opacity="0.9"/>
    <circle cx="18" cy="38" r="3" fill="#10b981"/>
  </g>

  <!-- Node 4: Back-Office Server (Bottom Right) -->
  <g transform="translate(305, 132)" filter="url(#shadowLan)">
    <rect x="0" y="0" width="48" height="44" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.8"/>
    <line x1="8" y1="12" x2="40" y2="12" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="40" y2="22" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="32" x2="40" y2="32" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <circle cx="36" cy="12" r="2" fill="#10b981"/>
    <circle cx="36" cy="22" r="2" fill="#34d399"/>
    <circle cx="36" cy="32" r="2" fill="#2dd4bf"/>
  </g>
</svg>
