<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowLan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="400" height="240" rx="12" fill="url(#bgGradLan)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 0 60 L 400 60 M 0 120 L 400 120 M 0 180 L 400 180" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  <path d="M 100 0 L 100 240 M 200 0 L 200 240 M 300 0 L 300 240" stroke="#ffffff" stroke-width="1" opacity="0.05"/>

  <!-- Network Connection Pulse Rings -->
  <circle cx="200" cy="120" r="75" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="200" cy="120" r="48" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6"/>

  <!-- Central LAN Gateway / Server Router -->
  <rect x="165" y="102" width="70" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2.5" filter="url(#glowLan)"/>
  <circle cx="183" cy="120" r="4" fill="#10b981"/>
  <circle cx="200" cy="120" r="4" fill="#34d399"/>
  <circle cx="217" cy="120" r="4" fill="#2dd4bf"/>
  <!-- Antennas -->
  <line x1="180" y1="102" x2="180" y2="88" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="220" y1="102" x2="220" y2="88" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Connected Client Nodes (Billing POS, Tablets, Laptops) -->
  <!-- Node 1: Top Left (POS Counter Terminal) -->
  <rect x="70" y="50" width="46" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="76" y="55" width="34" height="20" fill="#0f766e" opacity="0.8"/>
  <rect x="83" y="80" width="20" height="8" rx="2" fill="#475569"/>

  <!-- Node 2: Top Right (Tablet Terminal) -->
  <rect x="284" y="52" width="44" height="30" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="290" y="57" width="32" height="20" fill="#0f766e" opacity="0.8"/>

  <!-- Node 3: Bottom Left (Inventory Scanner Device) -->
  <rect x="80" y="150" width="28" height="42" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="85" y="156" width="18" height="24" fill="#10b981" opacity="0.8"/>

  <!-- Node 4: Bottom Right (Back-office Workstation) -->
  <rect x="280" y="150" width="48" height="32" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="286" y="155" width="36" height="22" fill="#10b981" opacity="0.8"/>

  <!-- High-Speed Connecting Fiber Lines -->
  <line x1="116" y1="65" x2="165" y2="108" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="284" y1="67" x2="235" y2="108" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="108" y1="165" x2="165" y2="130" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="280" y1="166" x2="235" y2="130" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Status Light Badges -->
  <circle cx="116" cy="65" r="3" fill="#34d399"/>
  <circle cx="284" cy="67" r="3" fill="#34d399"/>
  <circle cx="108" cy="165" r="3" fill="#34d399"/>
  <circle cx="280" cy="166" r="3" fill="#34d399"/>
</svg>
