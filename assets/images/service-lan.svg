  <rect x="100" y="155" width="22" height="35" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="280" y="155" width="22" height="35" rx="3" fill="#ffffff" opacity="0.9"/>
  <!-- Signal lines -->
  <line x1="125" y1="75" x2="180" y2="110" stroke="#34d399" stroke-width="2"/>
  <line x1="275" y1="75" x2="220" y2="110" stroke="#34d399" stroke-width="2"/>
  <line x1="120" y1="170" x2="180" y2="130" stroke="#34d399" stroke-width="2"/>
