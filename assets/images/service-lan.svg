<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#bgGrad1)"/>
  <circle cx="200" cy="120" r="70" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="200" cy="120" r="45" fill="none" stroke="#34d399" stroke-width="2"/>
  <!-- Central Server Router -->
  <rect x="175" y="105" width="50" height="30" rx="6" fill="#14b8a6"/>
  <circle cx="190" cy="120" r="3" fill="#ffffff"/>
  <circle cx="200" cy="120" r="3" fill="#ffffff"/>
  <circle cx="210" cy="120" r="3" fill="#ffffff"/>
  <!-- Devices connected -->
