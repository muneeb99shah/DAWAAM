<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowPos" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" rx="12" fill="url(#bgGradPos)"/>

  <!-- Main POS Billing Terminal Display -->
  <rect x="75" y="45" width="140" height="92" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="3" filter="url(#glowPos)"/>
  <rect x="83" y="53" width="124" height="76" fill="#0f766e" rx="4"/>
  <!-- Screen Header & Line Items -->
  <rect x="91" y="61" width="55" height="12" rx="3" fill="#ccfbf1"/>
  <rect x="91" y="80" width="108" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="91" y="91" width="85" height="6" rx="2" fill="#ffffff" opacity="0.7"/>
  <rect x="91" y="102" width="98" height="6" rx="2" fill="#ffffff" opacity="0.7"/>

  <!-- Stand & Base -->
  <rect x="135" y="137" width="20" height="25" fill="#334155"/>
  <rect x="110" y="162" width="70" height="10" rx="4" fill="#475569"/>

  <!-- Thermal Receipt Printer Right -->
  <rect x="235" y="110" width="55" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="245" y="116" width="35" height="6" fill="#0f172a"/>
  <!-- Paper Receipt coming out -->
  <rect x="248" y="90" width="29" height="28" fill="#ffffff" rx="2"/>
  <line x1="253" y1="96" x2="272" y2="96" stroke="#94a3b8" stroke-width="2"/>
  <line x1="253" y1="102" x2="268" y2="102" stroke="#94a3b8" stroke-width="2"/>
  <line x1="253" y1="108" x2="272" y2="108" stroke="#94a3b8" stroke-width="2"/>

  <!-- Barcode Laser Hand Scanner -->
  <g transform="translate(305, 75)">
    <path d="M 10 30 L 30 50 L 22 65 L 2 45 Z" fill="#10b981"/>
    <rect x="20" y="15" width="20" height="25" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <!-- Laser beam -->
    <line x1="20" y1="20" x2="-45" y2="25" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#glowPos)"/>
  </g>

  <!-- Local Server Tower Unit (Integrated Below POS) -->
  <rect x="315" y="135" width="45" height="65" rx="5" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="337" cy="150" r="4" fill="#10b981"/>
  <circle cx="337" cy="162" r="3" fill="#34d399"/>
  <line x1="325" y1="178" x2="350" y2="178" stroke="#475569" stroke-width="2"/>
  <line x1="325" y1="184" x2="350" y2="184" stroke="#475569" stroke-width="2"/>
</svg>
