<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowPos" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowPos" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="210" fill="url(#bgGradPos)"/>
  <rect width="400" height="210" fill="url(#glowPos)"/>

  <!-- Technical Architectural Grid Overlay -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <path d="M 0 35 H 400 M 0 70 H 400 M 0 105 H 400 M 0 140 H 400 M 0 175 H 400"/>
    <path d="M 50 0 V 210 M 100 0 V 210 M 150 0 V 210 M 200 0 V 210 M 250 0 V 210 M 300 0 V 210 M 350 0 V 210"/>
  </g>

  <!-- Main POS Touchscreen Billing Terminal (Center Left) -->
  <g transform="translate(60, 35)" filter="url(#shadowPos)">
    <!-- Monitor Bezel Frame -->
    <rect x="0" y="0" width="148" height="96" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="6" y="6" width="136" height="84" rx="5" fill="#0f172a"/>
    <!-- Screen Layout UI Header -->
    <rect x="12" y="12" width="60" height="12" rx="3" fill="#0f766e"/>
    <circle cx="132" cy="18" r="3" fill="#10b981"/>
    <!-- Line Item Billing Rows -->
    <rect x="12" y="32" width="112" height="6" rx="2" fill="#334155"/>
    <rect x="12" y="43" width="90" height="6" rx="2" fill="#334155"/>
    <rect x="12" y="54" width="102" height="6" rx="2" fill="#334155"/>
    <!-- Total Amount Pay Badge -->
    <rect x="12" y="68" width="55" height="14" rx="3" fill="#10b981"/>
    <!-- Terminal Stand -->
    <rect x="64" y="96" width="20" height="26" fill="#334155"/>
    <rect x="44" y="122" width="60" height="10" rx="4" fill="#475569"/>
  </g>

  <!-- Thermal Receipt Printer Unit (Center Right) -->
  <g transform="translate(230, 90)" filter="url(#shadowPos)">
    <rect x="0" y="0" width="60" height="52" rx="6" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.8"/>
    <rect x="10" y="6" width="40" height="6" fill="#0f172a"/>
    <!-- Printed Transaction Receipt Output -->
    <g transform="translate(14, -28)">
      <rect x="0" y="0" width="32" height="32" rx="2" fill="#ffffff"/>
      <line x1="6" y1="8" x2="26" y2="8" stroke="#94a3b8" stroke-width="2"/>
      <line x1="6" y1="15" x2="22" y2="15" stroke="#94a3b8" stroke-width="2"/>
      <line x1="6" y1="22" x2="26" y2="22" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>

  <!-- Barcode Laser Handheld Scanner (Top Right) -->
  <g transform="translate(305, 42)" filter="url(#shadowPos)">
    <path d="M 12 28 L 32 48 L 24 62 L 4 42 Z" fill="#10b981"/>
    <rect x="20" y="12" width="22" height="26" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <!-- Laser Scan Line -->
    <line x1="20" y1="22" x2="-45" y2="26" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Dawaam Dedicated Local Server Tower (Bottom Right) -->
  <g transform="translate(315, 115)" filter="url(#shadowPos)">
    <rect x="0" y="0" width="46" height="68" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="23" cy="16" r="4" fill="#10b981"/>
    <circle cx="23" cy="28" r="3" fill="#34d399"/>
    <line x1="10" y1="44" x2="36" y2="44" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="52" x2="36" y2="52" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
