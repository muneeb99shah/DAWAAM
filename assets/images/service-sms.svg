<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#bgGrad2)"/>
  <!-- Cellular Tower -->
  <line x1="200" y1="170" x2="200" y2="70" stroke="#f59e0b" stroke-width="4"/>
  <line x1="170" y1="170" x2="200" y2="70" stroke="#f59e0b" stroke-width="2"/>
  <line x1="230" y1="170" x2="200" y2="70" stroke="#f59e0b" stroke-width="2"/>
  <line x1="180" y1="130" x2="220" y2="130" stroke="#f59e0b" stroke-width="2"/>
  <line x1="185" y1="100" x2="215" y2="100" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="200" cy="65" r="6" fill="#ef4444"/>
  <!-- Broadcast waves -->
  <path d="M 170 55 A 35 35 0 0 1 230 55" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <path d="M 155 40 A 55 55 0 0 1 245 40" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <!-- Mobile Phone receiving SMS -->
  <rect x="70" y="100" width="45" height="80" rx="6" fill="#ffffff"/>
  <rect x="75" y="110" width="35" height="50" fill="#1e293b"/>
  <rect x="78" y="115" width="29" height="15" rx="3" fill="#f59e0b"/>
  <!-- Emergency Badge -->
  <rect x="270" y="110" width="70" height="35" rx="6" fill="#ef4444"/>
  <text x="305" y="132" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">SMS ALERT</text>
  <text x="200" y="215" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-weight="bold" font-size="14">SMS Emergency Gateway</text>
</svg>
