<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowSms" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" rx="12" fill="url(#bgGradSms)"/>

  <!-- Cellular Signal Broadcast Waves -->
  <path d="M 160 55 A 45 45 0 0 1 240 55" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 140 40 A 70 70 0 0 1 260 40" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 120 25 A 95 95 0 0 1 280 25" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Cellular Telecommunication Tower -->
  <line x1="200" y1="185" x2="200" y2="70" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="185" x2="200" y2="70" stroke="#d97706" stroke-width="2.5"/>
  <line x1="235" y1="185" x2="200" y2="70" stroke="#d97706" stroke-width="2.5"/>
  <!-- Cross Bracing -->
  <line x1="178" y1="140" x2="222" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <line x1="185" y1="105" x2="215" y2="105" stroke="#f59e0b" stroke-width="2"/>
  <line x1="192" y1="78" x2="208" y2="78" stroke="#f59e0b" stroke-width="2"/>
  <!-- Tower Light -->
  <circle cx="200" cy="65" r="7" fill="#ef4444" filter="url(#glowSms)"/>

  <!-- Mobile Gateway Receiver Smartphone Left -->
  <rect x="65" y="90" width="50" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="71" y="98" width="38" height="60" fill="#0f172a" rx="4"/>
  <!-- Envelope icon inside screen -->
  <rect x="77" y="112" width="26" height="18" rx="3" fill="#f59e0b"/>
  <path d="M 77 112 L 90 123 L 103 112" stroke="#1e293b" stroke-width="2" fill="none"/>

  <!-- Emergency Alert Badge Card Right -->
  <rect x="270" y="100" width="75" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2.5" filter="url(#glowSms)"/>
  <circle cx="307" cy="120" r="12" fill="#ef4444"/>
  <path d="M 307 113 L 307 123 M 307 127 L 307 129" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Signal Indicator Bars -->
  <rect x="285" y="145" width="6" height="8" rx="1" fill="#10b981"/>
  <rect x="295" y="142" width="6" height="11" rx="1" fill="#10b981"/>
  <rect x="305" y="139" width="6" height="14" rx="1" fill="#10b981"/>
  <rect x="315" y="136" width="6" height="17" rx="1" fill="#10b981"/>
  <rect x="325" y="133" width="6" height="20" rx="1" fill="#10b981"/>

  <!-- Wireless Rays to Phone & Badge -->
  <path d="M 175 110 L 115 125" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 225 110 L 270 125" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
</svg>
