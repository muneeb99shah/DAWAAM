<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowSms" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowSms" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="210" fill="url(#bgGradSms)"/>
  <rect width="400" height="210" fill="url(#glowSms)"/>

  <!-- Technical Architectural Grid Overlay -->
  <g opacity="0.06" stroke="#fbbf24" stroke-width="1">
    <path d="M 0 35 H 400 M 0 70 H 400 M 0 105 H 400 M 0 140 H 400 M 0 175 H 400"/>
    <path d="M 50 0 V 210 M 100 0 V 210 M 150 0 V 210 M 200 0 V 210 M 250 0 V 210 M 300 0 V 210 M 350 0 V 210"/>
  </g>

  <!-- Cellular Signal Radiating Arcs -->
  <path d="M 160 50 A 45 45 0 0 1 240 50" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 140 36 A 70 70 0 0 1 260 36" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <path d="M 120 22 A 95 95 0 0 1 280 22" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,5" opacity="0.3"/>

  <!-- Cellular Telecom Tower Center -->
  <g transform="translate(170, 48)">
    <line x1="30" y1="125" x2="30" y2="20" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="5" y1="125" x2="30" y2="20" stroke="#d97706" stroke-width="2"/>
    <line x1="55" y1="125" x2="30" y2="20" stroke="#d97706" stroke-width="2"/>
    <!-- Cross Bracing Structural Rungs -->
    <line x1="12" y1="95" x2="48" y2="95" stroke="#f59e0b" stroke-width="1.8"/>
    <line x1="18" y1="65" x2="42" y2="65" stroke="#f59e0b" stroke-width="1.8"/>
    <line x1="23" y1="40" x2="37" y2="40" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- Beacon Warning Light -->
    <circle cx="30" cy="14" r="6" fill="#ef4444" filter="url(#shadowSms)"/>
  </g>

  <!-- Mobile Android Gateway Device (Left Side) -->
  <g transform="translate(55, 60)" filter="url(#shadowSms)">
    <rect x="0" y="0" width="52" height="96" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="5" y="7" width="42" height="74" rx="5" fill="#0f172a"/>
    <!-- Screen Header & Active Message Box -->
    <rect x="10" y="14" width="32" height="6" rx="2" fill="#d97706"/>
    <g transform="translate(11, 28)">
      <rect x="0" y="0" width="30" height="22" rx="4" fill="#10b981"/>
      <path d="M 0 0 L 15 12 L 30 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    </g>
    <!-- Cellular Signal Bars inside phone -->
    <rect x="12" y="60" width="4" height="6" fill="#10b981"/>
    <rect x="18" y="57" width="4" height="9" fill="#10b981"/>
    <rect x="24" y="54" width="4" height="12" fill="#10b981"/>
    <rect x="30" y="51" width="4" height="15" fill="#10b981"/>
    <!-- Home Button -->
    <circle cx="26" cy="88" r="3" fill="#475569"/>
  </g>

  <!-- Emergency SMS Alert Dispatch Card (Right Side) -->
  <g transform="translate(275, 70)" filter="url(#shadowSms)">
    <rect x="0" y="0" width="76" height="72" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="6" y="6" width="64" height="60" rx="5" fill="#0f172a"/>
    <!-- Emergency Warning Badge -->
    <circle cx="38" cy="26" r="12" fill="#ef4444"/>
    <line x1="38" y1="19" x2="38" y2="28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="33" r="1.5" fill="#ffffff"/>
    <!-- Telemetry Signal Bars -->
    <rect x="16" y="48" width="5" height="10" rx="1" fill="#10b981"/>
    <rect x="24" y="45" width="5" height="13" rx="1" fill="#10b981"/>
    <rect x="32" y="42" width="5" height="16" rx="1" fill="#10b981"/>
    <rect x="40" y="39" width="5" height="19" rx="1" fill="#10b981"/>
    <rect x="48" y="36" width="5" height="22" rx="1" fill="#10b981"/>
  </g>

  <!-- Signal Transmission Wireless Conduit Streams -->
  <line x1="107" y1="105" x2="170" y2="105" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="230" y1="105" x2="275" y2="105" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
